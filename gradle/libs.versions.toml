bouncycastle = "1.87"
coroutines = "1.11.0"
hilt = "2.60.1"
androidxHilt = "1.4.0"
ksp = "2.3.14"
serialization = "1.13.0"
palette = "1.1.0"
protobuf = "4.31.1"
